name: Live third-party API checks
on:
  # Nightly, to catch API changes on the provider's side.
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:
  # Add each provider's code to both `paths` lists (see
  # server/test/live/README.md).
  push:
    branches: [main]
    paths:
      - 'server/**/*.live.test.ts'
      - 'server/test/live/**'
      - 'server/vitest.live.config.ts'
      - '.github/workflows/live_api_checks.yaml'
      - 'server/services/signalsService/signals/third_party_signals/zentropi/**'
  pull_request:
    paths:
      - 'server/**/*.live.test.ts'
      - 'server/test/live/**'
      - 'server/vitest.live.config.ts'
      - '.github/workflows/live_api_checks.yaml'
      - 'server/services/signalsService/signals/third_party_signals/zentropi/**'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  live_api_tests:
    # Pull requests from forks don't receive secrets, so skip them rather than
    # fail. Don't switch to pull_request_target to work around this: it would
    # run untrusted code with the API keys.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: live-api
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
          cache-dependency-path: server/package-lock.json

      - name: Install dependencies
        working-directory: server
        run: npm ci

      - name: Run live API tests
        working-directory: server
        env:
          ZENTROPI_API_KEY: ${{ secrets.ZENTROPI_API_KEY }}
          ZENTROPI_TEST_LABELER_ID: ${{ vars.ZENTROPI_TEST_LABELER_ID }}
          ZENTROPI_TEST_LABELER_VERSION_ID: ${{ vars.ZENTROPI_TEST_LABELER_VERSION_ID }}
        run: npm run test:live
